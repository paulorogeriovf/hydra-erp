<!-- Hydra ERP
     Responsável por: editar os dados de um piscineiro cadastrado. -->

{% extends "base.html" %}

{% block title %}
Editar Piscineiro - Hydra ERP
{% endblock %}

{% block header_title %}
✏️ <span>Editar Piscineiro</span>
{% endblock %}

{% block content %}

<div class="page-header">

    <div class="page-title">
        Editar Piscineiro

        <small>
            Atualize os dados do profissional
        </small>
    </div>

</div>


<div class="form-card">

    <form method="POST">

        <div class="form-row">

            <div class="form-group">

                <label>
                    Nome *
                </label>

                <input
                    type="text"
                    name="nome"
                    value="{{ piscineiro.nome }}"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Telefone
                </label>

                <input
                    type="text"
                    name="telefone"
                    value="{{ piscineiro.telefone or '' }}"
                >

            </div>

        </div>


        <div class="form-row">

            <div class="form-group">

                <label>
                    WhatsApp
                </label>

                <input
                    type="text"
                    name="whatsapp"
                    value="{{ piscineiro.whatsapp or '' }}"
                >

            </div>


            <div class="form-group">

                <label>
                    Cidade
                </label>

                <input
                    type="text"
                    name="cidade"
                    value="{{ piscineiro.cidade or '' }}"
                >

            </div>

        </div>


        <div class="form-group">

            <label>
                Endereço
            </label>

            <input
                type="text"
                name="endereco"
                value="{{ piscineiro.endereco or '' }}"
            >

        </div>


        <div class="form-group">

            <label>
                Observação
            </label>

            <textarea
                name="observacao"
            >{{ piscineiro.observacao or '' }}</textarea>

        </div>


        <div class="action-group">

            <button
                class="btn btn-primary"
                type="submit"
            >
                💾 Salvar Alterações
            </button>


            <a
                class="btn btn-ghost"
                href="{{ url_for('piscineiros.listar') }}"
            >
                Cancelar
            </a>

        </div>

    </form>

</div>

{% endblock %}
