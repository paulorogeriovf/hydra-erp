<!-- Hydra ERP
     Responsável por: cadastrar novos piscineiros. -->

{% extends "base.html" %}

{% block title %}
Novo Piscineiro - Hydra ERP
{% endblock %}

{% block header_title %}
🏊 <span>Novo Piscineiro</span>
{% endblock %}

{% block content %}

<div class="page-header">

    <div class="page-title">
        Novo Piscineiro

        <small>
            Cadastre um novo profissional
        </small>
    </div>

</div>


<div class="form-card">

    <form method="POST">

        <div class="form-row">

            <div class="form-group">

                <label>
                    Nome *
                </label>

                <input
                    type="text"
                    name="nome"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Telefone
                </label>

                <input
                    type="text"
                    name="telefone"
                >

            </div>

        </div>


        <div class="form-row">

            <div class="form-group">

                <label>
                    WhatsApp
                </label>

                <input
                    type="text"
                    name="whatsapp"
                >

            </div>


            <div class="form-group">

                <label>
                    Cidade
                </label>

                <input
                    type="text"
                    name="cidade"
                >

            </div>

        </div>


        <div class="form-group">

            <label>
                Endereço
            </label>

            <input
                type="text"
                name="endereco"
            >

        </div>


        <div class="form-group">

            <label>
                Observação
            </label>

            <textarea
                name="observacao"
            ></textarea>

        </div>


        <div class="action-group">

            <button
                class="btn btn-primary"
                type="submit"
            >
                💾 Salvar Piscineiro
            </button>


            <a
                class="btn btn-ghost"
                href="{{ url_for('piscineiros.listar') }}"
            >
                Cancelar
            </a>

        </div>

    </form>

</div>

{% endblock %}
