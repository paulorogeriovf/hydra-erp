<!-- Hydra ERP
     Responsável por: permitir a edição de produtos cadastrados. -->

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Editar Produto - Hydra ERP</title>
</head>

<body>

    <h1>Editar Produto</h1>

    <form method="POST">

        <div>
            <label>Nome *</label><br>

            <input
                type="text"
                name="nome"
                value="{{ produto.nome }}"
                required
            >
        </div>

        <br>

        <div>
            <label>Marca</label><br>

            <input
                type="text"
                name="marca"
                value="{{ produto.marca or '' }}"
            >
        </div>

        <br>

        <div>
            <label>Categoria</label><br>

            <input
                type="text"
                name="categoria"
                value="{{ produto.categoria or '' }}"
            >
        </div>

        <br>

        <div>
            <label>Preço Normal *</label><br>

            <input
                type="number"
                name="preco_normal"
                step="0.01"
                min="0"
                value="{{ produto.preco_normal }}"
                required
            >
        </div>

        <br>

        <div>
            <label>Preço Atacado</label><br>

            <input
                type="number"
                name="preco_atacado"
                step="0.01"
                min="0"
                value="{{ produto.preco_atacado or '' }}"
            >
        </div>

        <br>

        <div>
            <label>

                <input
                    type="checkbox"
                    name="gera_comissao"
                    {% if produto.gera_comissao %}checked{% endif %}
                >

                Produto gera comissão

            </label>
        </div>

        <br>

        <div>
            <label>Percentual de Comissão</label><br>

            <input
                type="number"
                name="percentual_comissao"
                step="0.01"
                min="0"
                max="100"
                value="{{ produto.percentual_comissao or '' }}"
            >
        </div>

        <br>

        <div>
            <label>Observação</label><br>

            <textarea
                name="observacao"
                rows="4"
                cols="40"
            >{{ produto.observacao or '' }}</textarea>
        </div>

        <br>

        <button type="submit">
            Salvar Alterações
        </button>

        <a href="{{ url_for('produtos.listar') }}">
            Cancelar
        </a>

    </form>

</body>
</html>
