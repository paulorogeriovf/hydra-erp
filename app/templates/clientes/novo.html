<!-- Hydra ERP
     Responsável por: cadastrar novos clientes e definir seu piscineiro inicial. -->

{% extends "base.html" %}

{% block title %}
Novo Cliente - Hydra ERP
{% endblock %}

{% block header_title %}
👤 <span>Novo Cliente</span>
{% endblock %}

{% block content %}

<div class="page-header">

    <div class="page-title">
        Novo Cliente

        <small>
            Cadastre o cliente e, se necessário, vincule um piscineiro
        </small>
    </div>

</div>


<div class="form-card">

    <form method="POST">

        <div class="form-row">

            <div class="form-group">

                <label>Nome *</label>

                <input
                    type="text"
                    name="nome"
                    required
                >

            </div>


            <div class="form-group">

                <label>Piscineiro Atual</label>

                <select name="piscineiro_id">

                    <option value="">
                        Sem piscineiro
                    </option>

                    {% for piscineiro in piscineiros %}

                        <option value="{{ piscineiro.id }}">
                            {{ piscineiro.nome }}
                        </option>

                    {% endfor %}

                </select>

            </div>

        </div>


        <div class="form-row">

            <div class="form-group">

                <label>Telefone</label>

                <input
                    type="text"
                    name="telefone"
                >

            </div>


            <div class="form-group">

                <label>WhatsApp</label>

                <input
                    type="text"
                    name="whatsapp"
                >

            </div>

        </div>


        <div class="form-row">

            <div class="form-group">

                <label>Cidade</label>

                <input
                    type="text"
                    name="cidade"
                >

            </div>


            <div class="form-group">

                <label>Endereço</label>

                <input
                    type="text"
                    name="endereco"
                >

            </div>

        </div>


        <div class="form-group">

            <label>Observação</label>

            <textarea
                name="observacao"
            ></textarea>

        </div>


        <div class="action-group">

            <button
                class="btn btn-primary"
                type="submit"
            >
                💾 Salvar Cliente
            </button>


            <a
                class="btn btn-ghost"
                href="{{ url_for('clientes.listar') }}"
            >
                Cancelar
            </a>

        </div>

    </form>

</div>

{% endblock %}
